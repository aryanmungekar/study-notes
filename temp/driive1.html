<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Custom Drive JSON</title>
</head>
<body>
  <h2>📂 Custom JSON Format</h2>
  <pre id="custom-json">Loading custom JSON...</pre>

  <h2>📂 Full Google Drive Metadata</h2>
  <pre id="full-json">Loading full JSON...</pre>

  <script>
    const API_KEY = "AIzaSyDVeYvprRkUxU9gwY6934UhPxbPUbmN1DU";
    const FOLDER_ID = "1pUimtsPNNrWLUDiTtN7UqUmHZRdY7XDz";  // folder ID

    async function fetchDriveFiles() {
      try {
        const url = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents&key=${API_KEY}&fields=files(*)`;
        const res = await fetch(url);
        const data = await res.json();

        // ✅ Custom format
        const formatted = data.files.map(file => {
          let [title, subtitle, exam] = file.name
            .replace(".pdf", "")
            .split("|")
            .map(s => s.trim());

          return {
            title: title || "",
            subtitle: subtitle || "",
            exam: exam || "",
            thumbnail: file.thumbnailLink || "",
            url: file.id
          };
        });

        // Show custom JSON
        document.getElementById("custom-json").textContent =
          JSON.stringify(formatted, null, 2);

        // Show full metadata JSON
        document.getElementById("full-json").textContent =
          JSON.stringify(data.files, null, 2);

      } catch (err) {
        document.getElementById("custom-json").textContent = "❌ Error fetching data";
        document.getElementById("full-json").textContent = err.message;
      }
    }

    fetchDriveFiles();
  </script>
</body>
</html>
