<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Custom Drive JSON</title>
</head>
<body>
  <h2>📂 Custom JSON Format</h2>
  <pre id="json-output">Loading...</pre>

  <script>
    const API_KEY = "AIzaSyDVeYvprRkUxU9gwY6934UhPxbPUbmN1DU";
    const FOLDER_ID = "1dqxp2FGU4wX7MOvZld8dNjwtvJcw58or";  // folder ID

    async function fetchDriveFiles() {
      const url = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents&key=${API_KEY}&fields=files(id,name,thumbnailLink,mimeType)`;
      const res = await fetch(url);
      const data = await res.json();

      // Transform into custom JSON
      const formatted = data.files.map(file => {
        let [title, subtitle, exam] = file.name.replace(".pdf", "").split("|").map(s => s.trim());

        return {
          title: title || "",
          subtitle: subtitle || "",
          exam: exam || "",
          thumbnail: file.thumbnailLink || "",
          url: file.id
        };
      });

      document.getElementById("json-output").textContent = JSON.stringify(formatted, null, 2);
    }

    fetchDriveFiles();
  </script>
</body>
</html>
