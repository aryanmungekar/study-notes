<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Study Notes</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      padding: 20px;
    }
    h2 {
      color: #333;
    }
    .folder {
      margin: 10px 0;
      padding-left: 15px;
      border-left: 2px solid #ccc;
    }
    .folder > h3 {
      cursor: pointer;
      color: #007bff;
    }
    a {
      display: inline-block;
      margin: 4px 0;
      text-decoration: none;
      color: #444;
    }
    a:hover {
      color: #007bff;
    }
  </style>
</head>
<body>
  <h2>📚 Study Notes</h2>
  <div id="notes-container">Loading...</div>

  <script>
    // 🔑 Replace with your details
    const API_KEY = "AIzaSyDVeYvprRkUxU9gwY6934UhPxbPUbmN1DU";
    const ROOT_FOLDER_ID = "1weVdncIAJ0C-Jqd5obCf87SaqAxkS6zu";  // e.g. from Drive URL

    const DRIVE_API = "https://www.googleapis.com/drive/v3/files";

    // Fetch folder contents
    async function fetchFolderContents(folderId) {
      const url = `${DRIVE_API}?q='${folderId}'+in+parents&key=${API_KEY}&fields=files(id,name,mimeType)`;
      const res = await fetch(url);
      const data = await res.json();
      return data.files || [];
    }

    // Render folder (recursive)
    async function renderFolder(folderId, container) {
      const files = await fetchFolderContents(folderId);
      for (const file of files) {
        if (file.mimeType === "application/vnd.google-apps.folder") {
          // Folder
          const folderDiv = document.createElement("div");
          folderDiv.className = "folder";

          const title = document.createElement("h3");
          title.textContent = "📂 " + file.name;

          const subDiv = document.createElement("div");
          subDiv.style.display = "none";

          // Toggle open/close
          title.addEventListener("click", () => {
            subDiv.style.display = subDiv.style.display === "none" ? "block" : "none";
          });

          folderDiv.appendChild(title);
          folderDiv.appendChild(subDiv);
          container.appendChild(folderDiv);

          // Recursive load
          renderFolder(file.id, subDiv);
        } else {
          // File link
          const fileLink = document.createElement("a");
          fileLink.href = `https://drive.google.com/file/d/${file.id}/view?usp=sharing`;
          fileLink.target = "_blank";
          fileLink.textContent = "📄 " + file.name;
          container.appendChild(fileLink);
          container.appendChild(document.createElement("br"));
        }
      }
    }

    // Init
    document.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById("notes-container");
      container.textContent = ""; // clear "Loading..."
      renderFolder(ROOT_FOLDER_ID, container);
    });
  </script>
</body>
</html>
