<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Drive JSON Viewer</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8f8f8; }
    .subject { margin-bottom: 30px; }
    h2 { background: #333; color: white; padding: 10px; border-radius: 6px; }
    .card {
      background: white;
      border-radius: 8px;
      padding: 15px;
      margin: 10px 0;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .card img {
      max-width: 120px;
      border-radius: 4px;
      margin-right: 10px;
    }
    .card-content { display: flex; align-items: center; }
    .card-info { flex: 1; }
    .card-title { font-weight: bold; }
    .card-subtitle { font-size: 14px; color: #666; }
    .card-exam { font-size: 12px; color: #999; }
  </style>
</head>
<body>
  <h1>📚 Subjects</h1>
  <div id="subjects"></div>

  <script>
    async function loadData() {
      // Load the JSON file (make sure data.json is in same folder or update path)
      const res = await fetch("data.json");
      const json = await res.json();

      const container = document.getElementById("subjects");

      // Loop through subjects
      Object.keys(json).forEach(subjectId => {
        const subject = json[subjectId];

        // Create subject section
        const section = document.createElement("div");
        section.className = "subject";
        section.innerHTML = `<h2>${subject.name}</h2>`;

        // For each category (notes, pyq, solved_pyq, uploads)
        ["notes", "pyq", "solved_pyq", "uploads"].forEach(cat => {
          if (subject[cat] && subject[cat].length > 0) {
            const catTitle = document.createElement("h3");
            catTitle.textContent = cat.toUpperCase();
            section.appendChild(catTitle);

            subject[cat].forEach(item => {
              const fileId = item.url;
              const previewUrl = `https://drive.google.com/file/d/${fileId}/preview`;
              const downloadUrl = `https://drive.google.com/uc?id=${fileId}&export=download`;

              const card = document.createElement("div");
              card.className = "card";

              card.innerHTML = `
                <div class="card-content">
                  <img src="${item.thumbnail || '/assets/images/default.png'}" alt="thumbnail">
                  <div class="card-info">
                    <div class="card-title">${item.title}</div>
                    <div class="card-subtitle">${item.subtitle || ""}</div>
                    <div class="card-exam">${item.exam || ""}</div>
                    <a href="${previewUrl}" target="_blank">🔎 Preview</a> |
                    <a href="${downloadUrl}" target="_blank">⬇ Download</a>
                  </div>
                </div>
              `;

              section.appendChild(card);
            });
          }
        });

        container.appendChild(section);
      });
    }

    loadData();
  </script>
</body>
</html>
